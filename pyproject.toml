[project]
name = "boresight"
version = "0.1.0"
description = "A computer-vision light gun"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "evdev>=1.9; sys_platform == 'linux'",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.16.0",
    "pre-commit>=4.6.1",
    "httpx2>=2.9.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/boresight"]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
filterwarnings = [
    "error::DeprecationWarning",
    "error::PendingDeprecationWarning",
]
