# The ESP32-CAM's generic firmware: built on every push, published for
# every version tag.
#
# "Generic": a fresh checkout has no firmware/boresight-cam/sdkconfig, so
# the build takes sdkconfig.defaults only. No board build has a Wi-Fi
# network, server or token -- those are set in setup mode -- so the image
# boots into setup mode, where a phone configures it. One image serves
# every gun.
#
# On a `v*` tag it also publishes a GitHub Release: the four flashing
# parts with their manifest (which the project site's flasher offers, see
# site.yml), and the app image that setup mode's firmware upload takes.
name: Firmware

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Generic ESP32-CAM image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build in the pinned ESP-IDF container
        run: firmware/boresight-cam/tools/idf.sh device build
      - name: Check that nothing secret went in
        working-directory: firmware/boresight-cam
        # A board's Wi-Fi, server and token are set only in setup mode, so
        # the board build has no such options at all: any of them showing
        # up means the build could carry them again.
        run: |
          if grep -E '^(# )?CONFIG_BORESIGHT_(WIFI_[A-Z_]+|SERVER_HOST|SERVER_PORT|TOKEN)\b' sdkconfig; then
            echo "the board build has network or token options: they belong to setup mode only" >&2
            exit 1
          fi
          if grep -qx 'CONFIG_BORESIGHT_TLS=y' sdkconfig || [ -e main/server_cert.pem ]; then
            echo "the generic build must not embed a server certificate" >&2
            exit 1
          fi
      - name: Bundle it for the flasher
        run: python3 website/flasher.py firmware/boresight-cam/build bundle
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: bundle

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: bundle
      - name: The tag must name the image's own version
        run: |
          version="$(python3 -c 'import json; print(json.load(open("bundle/manifest.json"))["version"])')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME but the image is $version: bump PROJECT_VER in firmware/boresight-cam/CMakeLists.txt" >&2
            exit 1
          fi
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes \
            --title "Boresight $GITHUB_REF_NAME" \
            bundle/files/* bundle/manifest.json
