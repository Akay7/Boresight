# The project site: the READMEs, rendered, with the ESP32-CAM flasher as
# one of its pages. Published on GitHub Pages by .github/workflows/site.yml;
# locally:
#
#   uv run --group docs mkdocs serve     # http://127.0.0.1:8000/
#
# The READMEs stay the only source. website/hooks.py assembles them into
# website/docs/ (generated, ignored) before every build, rewriting their
# repository links, and adds the flashing page with a firmware bundle.
site_name: Boresight
site_description: A light gun for any screen, aimed by a camera
site_url: https://akay7.github.io/Boresight/
repo_url: https://github.com/Akay7/Boresight
repo_name: Akay7/Boresight
edit_uri: ""

docs_dir: website/docs
site_dir: .site
# localhost is a secure context: Web Serial, and so the flasher, works.
dev_addr: 127.0.0.1:8000

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/brightness-7, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/brightness-4, name: Light mode }

markdown_extensions:
  - tables
  - admonition
  - attr_list
  - toc:
      permalink: true
  - pymdownx.superfences

nav:
  - Boresight: index.md
  - ESP32-CAM firmware: firmware.md
  - Printable case: case.md
  - Pi gun: pi-gun.md
  - Flash the ESP32-CAM: flash/index.html

hooks:
  - website/hooks.py

# Rebuild when a source changes, not only the generated pages.
watch:
  - README.md
  - firmware/boresight-cam/README.md
  - hardware/case/README.md
  - deploy/pi/README.md
  - website/flash
  - website/hooks.py
  - website/flasher.py
